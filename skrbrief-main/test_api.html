<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Prediction API Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 2rem;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #0ea5e9;
            font-size: 2.5rem;
        }
        
        .status {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 2rem;
        }
        
        .status.online {
            border-color: #10b981;
        }
        
        .status.offline {
            border-color: #ef4444;
        }
        
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        h2 {
            color: #0ea5e9;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #94a3b8;
            font-size: 0.875rem;
        }
        
        input {
            width: 100%;
            padding: 0.75rem;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.375rem;
            color: #e2e8f0;
            font-size: 1rem;
        }
        
        input:focus {
            outline: none;
            border-color: #0ea5e9;
        }
        
        button {
            background: #0ea5e9;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.375rem;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #0284c7;
        }
        
        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        
        .result {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.375rem;
            padding: 1rem;
            margin-top: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .loading {
            text-align: center;
            color: #0ea5e9;
            margin: 1rem 0;
        }
        
        .error {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            padding: 1rem;
            border-radius: 0.375rem;
            margin-top: 1rem;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        
        @media (max-width: 640px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
        
        .metric {
            background: #0f172a;
            padding: 1rem;
            border-radius: 0.375rem;
            border: 1px solid #334155;
        }
        
        .metric-label {
            color: #94a3b8;
            font-size: 0.75rem;
            margin-bottom: 0.25rem;
        }
        
        .metric-value {
            color: #e2e8f0;
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌦️ Weather Prediction API</h1>
        
        <div class="status" id="status">
            <div>API Status: <span id="statusText">Checking...</span></div>
            <div id="statusDetails"></div>
        </div>
        
        <div class="card">
            <h2>Single Point Prediction</h2>
            <div class="grid">
                <div class="form-group">
                    <label>Latitude</label>
                    <input type="number" id="lat" value="56.1304" step="0.0001">
                </div>
                <div class="form-group">
                    <label>Longitude</label>
                    <input type="number" id="lon" value="-106.3468" step="0.0001">
                </div>
            </div>
            <div class="grid">
                <div class="form-group">
                    <label>Altitude (feet)</label>
                    <input type="number" id="alt" value="10000" step="100">
                </div>
                <div class="form-group">
                    <label>DateTime (UTC)</label>
                    <input type="datetime-local" id="datetime" value="2026-01-15T12:00">
                </div>
            </div>
            <button onclick="predictPoint()" id="predictBtn">Get Prediction</button>
            
            <div id="pointResult"></div>
        </div>
        
        <div class="card">
            <h2>Model Information</h2>
            <button onclick="getInfo()">Load Info</button>
            <div id="infoResult"></div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:5001';
        
        // Check API health on load
        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                
                const statusEl = document.getElementById('status');
                const statusText = document.getElementById('statusText');
                const statusDetails = document.getElementById('statusDetails');
                
                if (data.status === 'ok') {
                    statusEl.className = 'status online';
                    statusText.textContent = '✅ Online';
                    statusDetails.innerHTML = `
                        Model: ${data.model_loaded ? '✅ Loaded' : '❌ Not loaded'}<br>
                        Stations: ${data.stations}
                    `;
                } else {
                    statusEl.className = 'status offline';
                    statusText.textContent = '❌ Offline';
                }
            } catch (error) {
                const statusEl = document.getElementById('status');
                const statusText = document.getElementById('statusText');
                statusEl.className = 'status offline';
                statusText.textContent = '❌ Cannot connect to API';
            }
        }
        
        async function predictPoint() {
            const btn = document.getElementById('predictBtn');
            const resultDiv = document.getElementById('pointResult');
            
            btn.disabled = true;
            resultDiv.innerHTML = '<div class="loading">⏳ Analyzing weather conditions...</div>';
            
            try {
                const lat = parseFloat(document.getElementById('lat').value);
                const lon = parseFloat(document.getElementById('lon').value);
                const alt = parseFloat(document.getElementById('alt').value);
                const datetime = document.getElementById('datetime').value + ':00Z';
                
                const query = {
                    lat,
                    lon,
                    alt,
                    datetime
                };
                
                const response = await fetch(`${API_BASE}/predict/point`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(query)
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Prediction failed');
                }
                
                const result = await response.json();
                
                // Display metrics
                const visibilitySM = (result.visibility / 1.609).toFixed(1);
                const tempF = (result.temperature * 9/5 + 32).toFixed(1);
                
                resultDiv.innerHTML = `
                    <div class="grid">
                        <div class="metric">
                            <div class="metric-label">Temperature</div>
                            <div class="metric-value">${result.temperature.toFixed(1)}°C</div>
                            <div class="metric-label">${tempF}°F</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Wind Speed</div>
                            <div class="metric-value">${result.windspeed.toFixed(0)} kts</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Wind Direction</div>
                            <div class="metric-value">${result.wind_direction.toFixed(0)}°</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Pressure</div>
                            <div class="metric-value">${result.pressure.toFixed(0)} hPa</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Visibility</div>
                            <div class="metric-value">${visibilitySM} SM</div>
                            <div class="metric-label">${result.visibility.toFixed(1)} km</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Nearest Station</div>
                            <div class="metric-value">${result.nearest_stations[0]}</div>
                            <div class="metric-label">${result.distances_km[0].toFixed(1)} km away</div>
                        </div>
                    </div>
                    <div class="result">${JSON.stringify(result, null, 2)}</div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ ${error.message}</div>`;
            } finally {
                btn.disabled = false;
            }
        }
        
        async function getInfo() {
            const resultDiv = document.getElementById('infoResult');
            resultDiv.innerHTML = '<div class="loading">Loading...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/info`);
                const data = await response.json();
                
                resultDiv.innerHTML = `<div class="result">${JSON.stringify(data, null, 2)}</div>`;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ ${error.message}</div>`;
            }
        }
        
        // Check health on page load
        checkHealth();
    </script>
</body>
</html>
